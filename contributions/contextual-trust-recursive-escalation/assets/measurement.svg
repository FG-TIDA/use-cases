<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="775" viewBox="0 0 1440 775" role="img" aria-label="A participation measure does not establish overall trust: finite register example and residual limits"><title>A participation measure does not establish overall trust: finite register example and residual limits</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667B"/></marker></defs><rect x="0" y="0" width="1440" height="775" rx="0" fill="#F4F7FA"/><text x="48" y="42.0" fill="#B7472A" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">02  /  MEASUREMENT AND ITS LIMITS</text><text x="48" y="92.0" fill="#142D48" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700">30% observed automation is not 30% trust.</text><text x="48" y="130.0" fill="#52667B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Synthetic example from Annex I.11: 100 registered activities; classification stipulated error-free.</text><text x="48" y="189.0" fill="#1B4D8E" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">THE KNOWN REGISTER</text><rect x="48" y="214" width="241.92" height="70" rx="0" fill="#176C63"/><rect x="289.92" y="214" width="564.48" height="70" rx="0" fill="#D7E2EB"/><rect x="854.4" y="214" width="537.6" height="70" rx="0" fill="#F0D5A5"/><text x="65" y="258.0" fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">18 · automation</text><text x="312" y="258.0" fill="#142D48" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">42 · confirmed no automation</text><text x="878" y="258.0" fill="#142D48" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">40 · unobserved</text><rect x="48" y="316" width="436" height="154" rx="14" fill="white" stroke="#CDD8E3"/><text x="72" y="373.0" fill="#142D48" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="700">30%</text><text x="72" y="411.0" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700">18 / 60 assessed</text><text x="72" y="444.0" fill="#52667B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400">Observed participation</text><rect x="502" y="316" width="436" height="154" rx="14" fill="white" stroke="#CDD8E3"/><text x="526" y="373.0" fill="#142D48" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="700">60%</text><text x="526" y="411.0" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700">60 / 100 registered</text><text x="526" y="444.0" fill="#52667B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400">Assessment coverage</text><rect x="956" y="316" width="436" height="154" rx="14" fill="white" stroke="#CDD8E3"/><text x="980" y="373.0" fill="#142D48" font-family="DejaVu Sans, Arial, sans-serif" font-size="42" font-weight="700">18–58%</text><text x="980" y="411.0" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700">Conditional logical bound</text><text x="980" y="444.0" fill="#52667B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400">Whole known register</text><rect x="48" y="498" width="1344" height="79" rx="10" fill="#FFF4E4"/><text x="70" y="530.0" fill="#946013" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700">The bound needs a complete register and the stated classification assumption.</text><text x="70" y="557.0" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400">It is not a confidence interval, a human share, an influence estimate or a reliability score.</text><rect x="48" y="608" width="312" height="92" rx="14" fill="white" stroke="#CDD8E3"/><text x="65" y="642.0" fill="#1B4D8E" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">METHOD</text><text x="65" y="675.0" fill="#52667B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400">Errors, reference, assumptions</text><rect x="392" y="608" width="312" height="92" rx="14" fill="white" stroke="#CDD8E3"/><text x="409" y="642.0" fill="#1B4D8E" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">COVERAGE</text><text x="409" y="675.0" fill="#52667B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400">Observed and omitted scope</text><rect x="736" y="608" width="312" height="92" rx="14" fill="white" stroke="#CDD8E3"/><text x="753" y="642.0" fill="#1B4D8E" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">FURTHER REVIEW</text><text x="753" y="675.0" fill="#52667B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400">Useful evidence in time</text><rect x="1080" y="608" width="312" height="92" rx="14" fill="white" stroke="#CDD8E3"/><text x="1097" y="642.0" fill="#1B4D8E" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">RESIDUAL</text><text x="1097" y="675.0" fill="#52667B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400">Material limits not quantified</text><text x="48" y="748.0" fill="#52667B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400">More records from the same branch do not resolve an unobserved branch or create review capacity.</text></svg>