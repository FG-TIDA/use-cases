<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="945" viewBox="0 0 1440 945" role="img" aria-label="From trust specifications to a bounded decision, including human subdelegation"><title>From trust specifications to a bounded decision, including human subdelegation</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667B"/></marker></defs><rect x="0" y="0" width="1440" height="945" rx="0" fill="#F4F7FA"/><text x="48" y="42.0" fill="#B7472A" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">01  /  THE CONCRETE PROCESS</text><text x="48" y="92.0" fill="#142D48" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700">Human escalation can return to an agent.</text><text x="48" y="130.0" fill="#52667B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Base fixture P0–P7; A3 is part of the separately selected escalation extension.</text><rect x="48" y="180" width="368" height="180" rx="14" fill="white" stroke="#CDD8E3"/><text x="70" y="216.0" fill="#1B4D8E" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">P0 · REQUIREMENT OWNER</text><text x="70" y="258" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Fix C0 and review policy.</text><text x="70" y="288" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Pin authority and independent</text><text x="70" y="318" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">expected outcomes.</text><rect x="502" y="180" width="386" height="180" rx="14" fill="white" stroke="#CDD8E3"/><text x="524" y="216.0" fill="#1B4D8E" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">P1–P3 · CONTRIBUTORS</text><text x="524" y="258" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Draft, implement and test.</text><text x="524" y="288" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Agents A1/A2 and tooling T1</text><text x="524" y="318" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">produce package D2.</text><rect x="978" y="180" width="414" height="180" rx="14" fill="white" stroke="#CDD8E3"/><text x="1000" y="216.0" fill="#1B4D8E" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">P4 · HUMAN REVIEWER H3</text><text x="1000" y="258" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Review and approve D2.</text><text x="1000" y="288" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">AP1 binds the exact package,</text><text x="1000" y="318" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">scope and required function.</text><path d="M416 270H491" fill="none" stroke="#52667B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M888 270H967" fill="none" stroke="#52667B" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="454" width="368" height="175" rx="14" fill="#EAF3F0" stroke="#CDD8E3"/><text x="70" y="490.0" fill="#176C63" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">INDEPENDENT REFERENCE</text><text x="70" y="532.0" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400">Candidate-generated tests</text><text x="70" y="559.55" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400">alone cannot establish that</text><text x="70" y="587.1" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400">C0 was interpreted correctly.</text><path d="M232 360V443" fill="none" stroke="#52667B" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="502" y="454" width="386" height="175" rx="14" fill="#FFF4E4" stroke="#CDD8E3"/><text x="524" y="490.0" fill="#946013" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">A3 · REVIEW ASSISTANT</text><text x="524" y="532.0" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400">H3 may consult another agent.</text><text x="524" y="559.55" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400">A response from H3 does not</text><text x="524" y="587.1" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400">prove the required judgment.</text><path d="M1090 360V406H695V443" fill="none" stroke="#52667B" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="704" y="397.0" fill="#52667B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400">possible subdelegation</text><rect x="978" y="454" width="414" height="175" rx="14" fill="white" stroke="#CDD8E3"/><text x="1000" y="490.0" fill="#1B4D8E" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">P5 · REVISED PACKAGE D3</text><text x="1000" y="532.0" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Check changed semantics.</text><text x="1000" y="561.0" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Approval of D2 does not</text><text x="1000" y="590.0" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">automatically cover D3.</text><path d="M1275 360V443" fill="none" stroke="#52667B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1185 629V693" fill="none" stroke="#52667B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M232 629V693" fill="none" stroke="#52667B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M695 629V693" fill="none" stroke="#52667B" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><rect x="48" y="704" width="1344" height="189" rx="14" fill="#142D48"/><text x="76" y="745.0" fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">P6 · RECEIVER DECISION</text><text x="76" y="786.0" fill="#D4E1EC" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400">Appraise current evidence, required review, dependencies and remaining uncertainty.</text><text x="76" y="834.0" fill="#90D7BD" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700">Sufficient under policy → bounded admission</text><text x="762" y="834.0" fill="#F6CAA0" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700">Unmet condition → hold / obtain review</text><text x="76" y="867.0" fill="#D4E1EC" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400">P7 retains corrections and supports a new, version-bound decision.</text><text x="48" y="927.0" fill="#52667B" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400">Conceptual reading aid · Section 2 and Annex I govern the scenario · No execution result is shown.</text></svg>