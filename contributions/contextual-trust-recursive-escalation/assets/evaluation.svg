<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="835" viewBox="0 0 1440 835" role="img" aria-label="R0 baseline, R1 reinforced controls and R2 changed conditions with controls preserved: proposed evaluation"><title>R0 baseline, R1 reinforced controls and R2 changed conditions with controls preserved: proposed evaluation</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52667B"/></marker></defs><rect x="0" y="0" width="1440" height="835" rx="0" fill="#F4F7FA"/><text x="48" y="42.0" fill="#B7472A" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">03  /  THE EVALUATION JOURNEY</text><text x="48" y="92.0" fill="#142D48" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700">A strong existing implementation can satisfy the case.</text><text x="48" y="130.0" fill="#52667B" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Three execution paths · Same decision criteria · Designed comparisons, not executed results</text><rect x="48" y="183" width="416" height="315" rx="14" fill="white" stroke="#CDD8E3"/><rect x="70" y="205" width="65" height="43" rx="6" fill="#1B4D8E"/><text x="83" y="235.0" fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700">R0</text><text x="70" y="289.0" fill="#142D48" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700">Existing configuration</text><text x="70" y="331" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Declared present controls</text><text x="70" y="360" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">and available evidence.</text><text x="70" y="389" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400"></text><text x="70" y="418" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Record success and failure;</text><text x="70" y="447" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">do not assume a gap.</text><rect x="512" y="183" width="416" height="315" rx="14" fill="white" stroke="#CDD8E3"/><rect x="534" y="205" width="65" height="43" rx="6" fill="#1B4D8E"/><text x="547" y="235.0" fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700">R1</text><text x="534" y="289.0" fill="#142D48" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700">Reinforced configuration</text><text x="534" y="331" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Address the observed gap</text><text x="534" y="360" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">with available standards.</text><text x="534" y="389" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400"></text><text x="534" y="418" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Repeat the frozen case</text><text x="534" y="447" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">and compliant controls.</text><rect x="976" y="183" width="416" height="315" rx="14" fill="white" stroke="#CDD8E3"/><rect x="998" y="205" width="65" height="43" rx="6" fill="#1B4D8E"/><text x="1011" y="235.0" fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700">R2</text><text x="998" y="289.0" fill="#142D48" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700">Changed conditions</text><text x="998" y="331" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Start from an R1 pass.</text><text x="998" y="360" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Retain the successful defenses.</text><text x="998" y="389" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400"></text><text x="998" y="418" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Change context, sources,</text><text x="998" y="447" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">actors or applicability.</text><path d="M464 349H501" fill="none" stroke="#52667B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M928 349H965" fill="none" stroke="#52667B" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="532" width="1344" height="92" rx="14" fill="#FFF4E4"/><text x="72" y="568.0" fill="#946013" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">R2 precondition: R1 must actually have passed.</text><text x="72" y="600.0" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400">Removing the successful defense is a separate ablation; it cannot demonstrate recurrence with controls intact.</text><rect x="48" y="654" width="652" height="103" rx="14" fill="#EAF3F0"/><text x="70" y="690.0" fill="#176C63" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">POSITIVE CONTROLS</text><text x="70" y="724.0" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Compliant automated or assisted work must advance.</text><rect x="724" y="654" width="668" height="103" rx="14" fill="#EDF2F9"/><text x="746" y="690.0" fill="#1B4D8E" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">UNSUPPORTED CLAIMS</text><text x="746" y="724.0" fill="#24364A" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400">Preserve unresolved conditions and apply policy.</text><text x="48" y="803.0" fill="#52667B" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400">Measure incorrect admission, unnecessary holds, lost qualifiers, revalidation delay and reviewer effort.</text></svg>